name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # -----------------------------------------------------------------------
  # Backend: lint + smoke-import check + Docker build
  # -----------------------------------------------------------------------
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt flake8

      - name: Lint (flake8)
        run: |
          flake8 backend/app \
            --max-line-length=100 \
            --extend-ignore=E501,W503 \
            --exclude=backend/app/**/__pycache__

      - name: Smoke-import check
        # Verifies all modules parse and import without a live DB
        run: |
          cd backend
          python -c "
          import os
          os.environ.setdefault('DATABASE_URL', 'postgresql://user:pass@localhost:5432/test')
          os.environ.setdefault('SECRET_KEY', 'a' * 32)
          from app.main import app
          print('Import OK — routes:', [r.path for r in app.routes])
          "

      - name: Build Docker image
        run: docker build -f backend/Dockerfile -t churniq-backend:ci .

  # -----------------------------------------------------------------------
  # Frontend: type-check + build + Docker build
  # -----------------------------------------------------------------------
  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check + build
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8000

      - name: Build Docker image
        run: |
          docker build \
            -f frontend/Dockerfile \
            --build-arg VITE_API_URL=http://localhost:8000 \
            -t churniq-frontend:ci .
